<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>Three ophthalmic representations</title><desc>These are conceptual views, not interchangeable diagnostic inputs.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f8c"/></marker></defs><rect width="1000" height="560" fill="#f7fafb"/><text x="38" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">Three ophthalmic representations</text><text x="38" y="80" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" font-weight="400" text-anchor="start">These are conceptual views, not interchangeable diagnostic inputs.</text><line x1="38" y1="100" x2="962" y2="100" stroke="#087f8c" stroke-width="2"/><rect x="40.0" y="155" width="293.3333333333333" height="280" rx="10" fill="white" stroke="#d4e1e6"/><rect x="40.0" y="155" width="5" height="280" rx="0" fill="#087f8c" stroke="none"/><text x="60.0" y="187" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">Fundus photograph</text><text x="60.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">A surface view of retina,</text><text x="60.0" y="242" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">disc, and visible vessels.</text><text x="60.0" y="267" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Preserve field of view and</text><text x="60.0" y="292" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">laterality.</text><rect x="353.3333333333333" y="155" width="293.3333333333333" height="280" rx="10" fill="white" stroke="#d4e1e6"/><rect x="353.3333333333333" y="155" width="5" height="280" rx="0" fill="#c65a46" stroke="none"/><text x="373.3333333333333" y="187" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#c65a46" font-weight="700" text-anchor="start">OCT volume</text><text x="373.3333333333333" y="217" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Depth-resolved reflectivity</text><text x="373.3333333333333" y="242" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">assembled into B-scans and</text><text x="373.3333333333333" y="267" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">volumes. Preserve scan</text><text x="373.3333333333333" y="292" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">geometry.</text><rect x="666.6666666666666" y="155" width="293.3333333333333" height="280" rx="10" fill="white" stroke="#d4e1e6"/><rect x="666.6666666666666" y="155" width="5" height="280" rx="0" fill="#087f8c" stroke="none"/><text x="686.6666666666666" y="187" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">OCT angiography</text><text x="686.6666666666666" y="217" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Derived vascular contrast from</text><text x="686.6666666666666" y="242" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">repeated acquisitions.</text><text x="686.6666666666666" y="267" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Preserve processing and</text><text x="686.6666666666666" y="292" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">artifact context.</text><text x="500" y="478" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#17324d" font-weight="700" text-anchor="middle">Camera image, depth section, and vascular map answer different questions</text><line x1="38" y1="510" x2="962" y2="510" stroke="#d4e1e6" stroke-width="1"/><text x="38" y="539" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526777" font-weight="400" text-anchor="start">Original schematic • AI in Medical Imaging • Not a patient image</text></svg>