<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>Computation and acceptance are separate states</title><desc>Failures and cancellation remain part of the audit trail.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f8c"/></marker></defs><rect width="1000" height="560" fill="#f7fafb"/><text x="38" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">Computation and acceptance are separate states</text><text x="38" y="80" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" font-weight="400" text-anchor="start">Failures and cancellation remain part of the audit trail.</text><line x1="38" y1="100" x2="962" y2="100" stroke="#087f8c" stroke-width="2"/><rect x="60" y="135" width="400" height="140" rx="10" fill="white" stroke="#d4e1e6"/><rect x="60" y="135" width="5" height="140" rx="0" fill="#087f8c" stroke="none"/><text x="80" y="167" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">1. Eligible → queued</text><text x="80" y="197" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Freeze the source manifest and assign an</text><text x="80" y="222" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">idempotent job key.</text><rect x="540" y="135" width="400" height="140" rx="10" fill="white" stroke="#d4e1e6"/><rect x="540" y="135" width="5" height="140" rx="0" fill="#087f8c" stroke="none"/><text x="560" y="167" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">2. Running</text><text x="560" y="197" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Record version and progress; support</text><text x="560" y="222" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">bounded retry and cancellation.</text><rect x="540" y="325" width="400" height="140" rx="10" fill="white" stroke="#d4e1e6"/><rect x="540" y="325" width="5" height="140" rx="0" fill="#087f8c" stroke="none"/><text x="560" y="357" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">3. Draft → reviewed</text><text x="560" y="387" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Preserve original output, corrections, and</text><text x="560" y="412" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">accepted interpretation.</text><rect x="60" y="325" width="400" height="140" rx="10" fill="white" stroke="#d4e1e6"/><rect x="60" y="325" width="5" height="140" rx="0" fill="#087f8c" stroke="none"/><text x="80" y="357" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">4. Exported</text><text x="80" y="387" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Use source references and duplicate-safe</text><text x="80" y="412" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">publication; retain supersession.</text><line x1="465" y1="205" x2="525" y2="205" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><line x1="740" y1="280" x2="740" y2="313" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><line x1="530" y1="395" x2="475" y2="395" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="490" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c65a46" font-weight="700" text-anchor="middle">A completed model call is not yet a clinical result</text><line x1="38" y1="510" x2="962" y2="510" stroke="#d4e1e6" stroke-width="1"/><text x="38" y="539" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526777" font-weight="400" text-anchor="start">Original schematic • AI in Medical Imaging • Not a patient image</text></svg>