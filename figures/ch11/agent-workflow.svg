<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>An agent coordinates evidence and accountable actions</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526779"/></marker></defs>
<rect width="1200" height="800" fill="#fbfaf6"/>
<text x="50" y="58" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#18354a" font-weight="bold" text-anchor="start">An agent coordinates evidence and accountable actions</text>
<text x="50" y="96" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#526779" font-weight="normal" text-anchor="start">Proposed workflow • Every study retains the ordinary clinical reading pathway.</text>
<rect x="50" y="145" width="330" height="115" rx="12" fill="white" stroke="#007f86" stroke-width="2"/><text x="70" y="179" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#007f86" font-weight="bold" text-anchor="start">Study arrives</text><text x="70" y="210" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Validate identity, view and input.</text><text x="70" y="235" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Determine model eligibility.</text>
<rect x="470" y="145" width="340" height="115" rx="12" fill="white" stroke="#007f86" stroke-width="2"/><text x="490" y="179" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#007f86" font-weight="bold" text-anchor="start">Evidence + model</text><text x="490" y="210" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Retrieve verified current / prior.</text><text x="490" y="235" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Record findings and provenance.</text>
<line x1="380" y1="200" x2="455" y2="200" stroke="#526779" stroke-width="3" marker-end="url(#arrow)"/>
<text x="396" y="179" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#18354a" font-weight="normal" text-anchor="start">eligible</text>
<rect x="50" y="360" width="330" height="125" rx="12" fill="white" stroke="#c75543" stroke-width="2"/><text x="70" y="394" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#c75543" font-weight="bold" text-anchor="start">Exception / routine reading</text><text x="70" y="425" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Ineligible, missing data or failure.</text><text x="70" y="450" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Unavailable is not negative.</text>
<line x1="205" y1="260" x2="205" y2="345" stroke="#526779" stroke-width="3" marker-end="url(#arrow)"/>
<text x="218" y="309" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c75543" font-weight="normal" text-anchor="start">exception</text>
<rect x="470" y="360" width="340" height="125" rx="12" fill="white" stroke="#007f86" stroke-width="2"/><text x="490" y="394" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#007f86" font-weight="bold" text-anchor="start">Evidence-grounded draft</text><text x="490" y="425" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">No invented comparisons.</text><text x="490" y="450" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">No unsupported measurements.</text>
<line x1="640" y1="260" x2="640" y2="345" stroke="#526779" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="470" y="585" width="340" height="130" rx="12" fill="white" stroke="#007f86" stroke-width="2"/><text x="490" y="619" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#007f86" font-weight="bold" text-anchor="start">Clinician review</text><text x="490" y="650" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Edit or reject, then sign.</text><text x="490" y="675" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Approve communication / tasks.</text>
<line x1="640" y1="485" x2="640" y2="570" stroke="#526779" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="880" y="585" width="270" height="130" rx="12" fill="white" stroke="#007f86" stroke-width="2"/><text x="900" y="619" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#007f86" font-weight="bold" text-anchor="start">Track approved actions</text><text x="900" y="650" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Owner; acknowledgment.</text><text x="900" y="675" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Completion or resolution.</text>
<line x1="810" y1="650" x2="865" y2="650" stroke="#526779" stroke-width="3" marker-end="url(#arrow)"/>
<text x="50" y="768" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#007f86" font-weight="normal" text-anchor="start">Maintain versioned state • Deduplicate events • Audit evidence and actions • Supersede stale results</text>
</svg>