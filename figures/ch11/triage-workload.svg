<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>How 90% sensitivity can still create many false flags</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526779"/></marker></defs>
<rect width="1200" height="650" fill="#fbfaf6"/>
<text x="50" y="58" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#18354a" font-weight="bold" text-anchor="start">How 90% sensitivity can still create many false flags</text>
<text x="50" y="96" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#526779" font-weight="normal" text-anchor="start">Hypothetical example • 1,000 studies • 5% prevalence • 90% sensitivity and specificity</text>
<text x="390" y="161" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#18354a" font-weight="bold" text-anchor="middle">Finding present (50)</text>
<text x="795" y="161" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#18354a" font-weight="bold" text-anchor="middle">Finding absent (950)</text>
<text x="50" y="260" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#007f86" font-weight="bold" text-anchor="start">Flagged</text>
<text x="50" y="409" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#526779" font-weight="bold" text-anchor="start">Not flagged</text>
<rect x="220" y="185" width="350" height="125" rx="12" fill="white" stroke="#007f86" stroke-width="2"/><text x="240" y="219" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#007f86" font-weight="bold" text-anchor="start">45 true positives</text><text x="240" y="250" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Correctly flagged</text>
<rect x="620" y="185" width="350" height="125" rx="12" fill="white" stroke="#c75543" stroke-width="2"/><text x="640" y="219" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#c75543" font-weight="bold" text-anchor="start">95 false positives</text><text x="640" y="250" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Flagged without the target finding</text>
<rect x="220" y="335" width="350" height="125" rx="12" fill="white" stroke="#c75543" stroke-width="2"/><text x="240" y="369" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#c75543" font-weight="bold" text-anchor="start">5 false negatives</text><text x="240" y="400" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Target finding missed</text>
<rect x="620" y="335" width="350" height="125" rx="12" fill="white" stroke="#007f86" stroke-width="2"/><text x="640" y="369" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#007f86" font-weight="bold" text-anchor="start">855 true negatives</text><text x="640" y="400" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Correctly unflagged</text>
<text x="50" y="532" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#18354a" font-weight="bold" text-anchor="start">140 flags = 45 true positives + 95 false positives</text>
<text x="50" y="578" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#007f86" font-weight="bold" text-anchor="start">Positive predictive value = 45 / 140 = 32.1%</text>
<text x="50" y="620" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526779" font-weight="normal" text-anchor="start">Calculated teaching example; not measured performance of any named model or product.</text>
</svg>