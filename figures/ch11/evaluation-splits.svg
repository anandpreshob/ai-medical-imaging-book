<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><title>Split the patients, then use their images</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526779"/></marker></defs>
<rect width="1200" height="620" fill="#fbfaf6"/>
<text x="50" y="58" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#18354a" font-weight="bold" text-anchor="start">Split the patients, then use their images</text>
<text x="50" y="96" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#526779" font-weight="normal" text-anchor="start">Paired views and repeated examinations stay with the same patient.</text>
<rect x="50" y="150" width="510" height="105" rx="12" fill="white" stroke="#007f86" stroke-width="2"/><text x="70" y="184" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#007f86" font-weight="bold" text-anchor="start">Development patients</text><text x="70" y="215" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Choose partitions before model fitting.</text>
<rect x="650" y="150" width="500" height="105" rx="12" fill="white" stroke="#007f86" stroke-width="2"/><text x="670" y="184" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#007f86" font-weight="bold" text-anchor="start">Independent evaluation</text><text x="670" y="215" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">No fitting or threshold selection here.</text>
<line x1="200" y1="255" x2="185" y2="310" stroke="#526779" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="420" y1="255" x2="450" y2="310" stroke="#526779" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="790" y1="255" x2="785" y2="310" stroke="#526779" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1030" y1="255" x2="1050" y2="310" stroke="#526779" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="50" y="325" width="260" height="155" rx="12" fill="white" stroke="#007f86" stroke-width="2"/><text x="70" y="359" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#007f86" font-weight="bold" text-anchor="start">Training</text><text x="70" y="390" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Fit model parameters.</text><text x="70" y="415" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">All views stay together.</text>
<rect x="340" y="325" width="260" height="155" rx="12" fill="white" stroke="#007f86" stroke-width="2"/><text x="360" y="359" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#007f86" font-weight="bold" text-anchor="start">Validation</text><text x="360" y="390" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Choose thresholds.</text><text x="360" y="415" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Tune model choices.</text>
<rect x="650" y="325" width="235" height="155" rx="12" fill="white" stroke="#007f86" stroke-width="2"/><text x="670" y="359" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#007f86" font-weight="bold" text-anchor="start">Internal test</text><text x="670" y="390" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Locked patient cohort.</text><text x="670" y="415" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Same source setting.</text>
<rect x="915" y="325" width="235" height="155" rx="12" fill="white" stroke="#007f86" stroke-width="2"/><text x="935" y="359" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#007f86" font-weight="bold" text-anchor="start">External test</text><text x="935" y="390" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Different site or time.</text><text x="935" y="415" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">Check prior exposure.</text>
<text x="50" y="548" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#007f86" font-weight="bold" text-anchor="start">One patient → one partition. MIMIC-CXR and MIMIC-CXR-JPG are overlapping resources.</text>
<text x="50" y="584" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526779" font-weight="normal" text-anchor="start">Also guard against future reports leaking into earlier predictions and public-benchmark pretraining.</text>
</svg>