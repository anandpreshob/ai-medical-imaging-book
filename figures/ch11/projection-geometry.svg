<text x="50" y="96" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#526779" font-weight="normal" text-anchor="start">Same object, same source-to-detector distance; only object position changes.</text>
<text x="60" y="155" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#007f86" font-weight="bold" text-anchor="start">Object close to detector</text>
