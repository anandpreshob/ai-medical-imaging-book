<line x1="525" y1="237.85714285714286" x2="525" y2="362.14285714285717" stroke="#c75543" stroke-width="13"/>
<text x="90" y="455" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#18354a" font-weight="normal" text-anchor="middle">Source</text>
<text x="370" y="455" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#18354a" font-weight="normal" text-anchor="middle">Object</text>
<text x="525" y="455" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#18354a" font-weight="normal" text-anchor="middle">Detector</text>
<text x="60" y="510" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="start">PA positioning reduces cardiac magnification</text>
<text x="650" y="155" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#007f86" font-weight="bold" text-anchor="start">Object farther from detector</text>
<circle cx="680" cy="300" r="9" fill="#c75543"/>
<line x1="680" y1="300" x2="1115" y2="191.25" stroke="#c75543" stroke-width="2"/>
