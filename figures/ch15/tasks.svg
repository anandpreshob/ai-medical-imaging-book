<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>Current detection and future risk are different tasks</title><desc>Similar-looking scores can describe different events and time horizons.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f8c"/></marker></defs><rect width="1000" height="560" fill="#f7fafb"/><text x="38" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">Current detection and future risk are different tasks</text><text x="38" y="80" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" font-weight="400" text-anchor="start">Similar-looking scores can describe different events and time horizons.</text><line x1="38" y1="100" x2="962" y2="100" stroke="#087f8c" stroke-width="2"/><rect x="40.0" y="155" width="450.0" height="280" rx="10" fill="white" stroke="#d4e1e6"/><rect x="40.0" y="155" width="5" height="280" rx="0" fill="#087f8c" stroke="none"/><text x="60.0" y="187" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">Current examination</text><text x="60.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Detect or assess a lesion already represented in</text><text x="60.0" y="242" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">the images. Reference: the defined current</text><text x="60.0" y="267" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">finding or cancer outcome.</text><rect x="510.0" y="155" width="450.0" height="280" rx="10" fill="white" stroke="#d4e1e6"/><rect x="510.0" y="155" width="5" height="280" rx="0" fill="#c65a46" stroke="none"/><text x="530.0" y="187" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#c65a46" font-weight="700" text-anchor="start">Future risk</text><text x="530.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Estimate a specified event over a stated follow-</text><text x="530.0" y="242" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">up horizon. Reference: time-aware outcomes and</text><text x="530.0" y="267" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">censoring.</text><text x="500" y="478" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#17324d" font-weight="700" text-anchor="middle">A detection score is not automatically a calibrated future-risk estimate</text><line x1="38" y1="510" x2="962" y2="510" stroke="#d4e1e6" stroke-width="1"/><text x="38" y="539" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526777" font-weight="400" text-anchor="start">Original schematic • AI in Medical Imaging • Not a patient image</text></svg>