<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>Tomosynthesis: a correlated image stack</title><desc>Limited-angle acquisition is not a set of independent examinations.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f8c"/></marker></defs><rect width="1000" height="560" fill="#f7fafb"/><text x="38" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">Tomosynthesis: a correlated image stack</text><text x="38" y="80" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" font-weight="400" text-anchor="start">Limited-angle acquisition is not a set of independent examinations.</text><line x1="38" y1="100" x2="962" y2="100" stroke="#087f8c" stroke-width="2"/><rect x="40" y="185" width="280" height="180" rx="10" fill="white" stroke="#d4e1e6"/><rect x="40" y="185" width="5" height="180" rx="0" fill="#087f8c" stroke="none"/><text x="60" y="217" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">Projection set</text><text x="60" y="247" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Several X-ray views acquired</text><text x="60" y="272" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">across a limited angular</text><text x="60" y="297" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">range.</text><line x1="326" y1="275" x2="352" y2="275" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="360" y="185" width="280" height="180" rx="10" fill="white" stroke="#d4e1e6"/><rect x="360" y="185" width="5" height="180" rx="0" fill="#087f8c" stroke="none"/><text x="380" y="217" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">Depth planes</text><text x="380" y="247" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Reconstruction yields</text><text x="380" y="272" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">correlated planes with task-</text><text x="380" y="297" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">specific resolution.</text><line x1="646" y1="275" x2="672" y2="275" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="680" y="185" width="280" height="180" rx="10" fill="white" stroke="#d4e1e6"/><rect x="680" y="185" width="5" height="180" rx="0" fill="#087f8c" stroke="none"/><text x="700" y="217" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">Derived overview</text><text x="700" y="247" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">A synthesized 2D image may</text><text x="700" y="272" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">accompany the stack;</text><text x="700" y="297" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">preserve its identity.</text><text x="500" y="490" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c65a46" font-weight="700" text-anchor="middle">Do not split planes from one examination across train and test sets</text><line x1="38" y1="510" x2="962" y2="510" stroke="#d4e1e6" stroke-width="1"/><text x="38" y="539" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526777" font-weight="400" text-anchor="start">Original schematic • AI in Medical Imaging • Not a patient image</text></svg>