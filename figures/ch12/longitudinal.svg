<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>Longitudinal lesion identity</title><desc>Matching is an evidence-based decision, not a forced nearest-neighbor assignment.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f8c"/></marker></defs><rect width="1000" height="560" fill="#f7fafb"/><text x="38" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">Longitudinal lesion identity</text><text x="38" y="80" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" font-weight="400" text-anchor="start">Matching is an evidence-based decision, not a forced nearest-neighbor assignment.</text><line x1="38" y1="100" x2="962" y2="100" stroke="#087f8c" stroke-width="2"/><text x="170" y="145" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#087f8c" font-weight="700" text-anchor="start">Baseline</text><text x="665" y="145" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#087f8c" font-weight="700" text-anchor="start">Follow-up</text><rect x="100" y="170" width="200" height="270" rx="10" fill="white" stroke="#d4e1e6"/><rect x="630" y="170" width="200" height="270" rx="10" fill="white" stroke="#d4e1e6"/><circle cx="200" cy="215" r="18" fill="#087f8c"/><circle cx="200" cy="320" r="25" fill="#c65a46"/><circle cx="730" cy="220" r="22" fill="#087f8c"/><circle cx="730" cy="330" r="16" fill="#b17a14"/><circle cx="730" cy="400" r="12" fill="#17324d"/><line x1="240" y1="215" x2="685" y2="220" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><text x="458" y="202" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#087f8c" font-weight="400" text-anchor="middle">Supported match</text><line x1="245" y1="320" x2="677" y2="330" stroke="#c65a46" stroke-width="2" stroke-dasharray="7 5"/><text x="458" y="306" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c65a46" font-weight="400" text-anchor="middle">Unresolved identity</text><text x="600" y="408" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#17324d" font-weight="400" text-anchor="end">New focus</text><text x="500" y="480" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#17324d" font-weight="700" text-anchor="middle">Also represent resolved lesions; do not invent a numeric change for a new target.</text><line x1="38" y1="510" x2="962" y2="510" stroke="#d4e1e6" stroke-width="1"/><text x="38" y="539" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526777" font-weight="400" text-anchor="start">Original schematic • AI in Medical Imaging • Not a patient image</text></svg>