<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>Video tasks live on different time scales</title><desc>Choose an evaluation unit that matches the clinical claim.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f8c"/></marker></defs><rect width="1000" height="560" fill="#f7fafb"/><text x="38" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">Video tasks live on different time scales</text><text x="38" y="80" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" font-weight="400" text-anchor="start">Choose an evaluation unit that matches the clinical claim.</text><line x1="38" y1="100" x2="962" y2="100" stroke="#087f8c" stroke-width="2"/><text x="45" y="165" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#087f8c" font-weight="700" text-anchor="start">Frame</text><rect x="190" y="145" width="160" height="36" rx="10" fill="#087f8c" stroke="none"/><text x="200" y="170" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="white" font-weight="400" text-anchor="start">Candidate location</text><text x="45" y="245" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c65a46" font-weight="700" text-anchor="start">Event</text><rect x="190" y="225" width="330" height="36" rx="10" fill="#c65a46" stroke="none"/><text x="200" y="250" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="white" font-weight="400" text-anchor="start">Persistent finding</text><text x="45" y="325" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#b17a14" font-weight="700" text-anchor="start">Phase</text><rect x="190" y="305" width="530" height="36" rx="10" fill="#b17a14" stroke="none"/><text x="200" y="330" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="white" font-weight="400" text-anchor="start">Workflow interval</text><text x="45" y="405" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#17324d" font-weight="700" text-anchor="start">Procedure</text><rect x="190" y="385" width="735" height="36" rx="10" fill="#17324d" stroke="none"/><text x="200" y="410" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="white" font-weight="400" text-anchor="start">Complete episode</text><text x="500" y="485" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#17324d" font-weight="700" text-anchor="middle">Adjacent frames are correlated; a long false alarm is one important event.</text><line x1="38" y1="510" x2="962" y2="510" stroke="#d4e1e6" stroke-width="1"/><text x="38" y="539" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526777" font-weight="400" text-anchor="start">Original schematic • AI in Medical Imaging • Not a patient image</text></svg>