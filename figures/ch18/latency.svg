<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>Capture-to-display latency</title><desc>Illustrative 100 ms budget; not a clinical performance requirement.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f8c"/></marker></defs><rect width="1000" height="560" fill="#f7fafb"/><text x="38" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">Capture-to-display latency</text><text x="38" y="80" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" font-weight="400" text-anchor="start">Illustrative 100 ms budget; not a clinical performance requirement.</text><line x1="38" y1="100" x2="962" y2="100" stroke="#087f8c" stroke-width="2"/><rect x="50" y="220" width="177" height="85" rx="0" fill="#087f8c" stroke="none"/><text x="140.0" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#087f8c" font-weight="700" text-anchor="middle">Capture</text><text x="140.0" y="271" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">20 ms</text><rect x="230" y="220" width="87" height="85" rx="0" fill="#b17a14" stroke="none"/><text x="275.0" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b17a14" font-weight="700" text-anchor="middle">Queue</text><text x="275.0" y="271" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">10 ms</text><rect x="320" y="220" width="132" height="85" rx="0" fill="#c65a46" stroke="none"/><text x="387.5" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#c65a46" font-weight="700" text-anchor="middle">Preprocess</text><text x="387.5" y="271" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">15 ms</text><rect x="455" y="220" width="312" height="85" rx="0" fill="#17324d" stroke="none"/><text x="612.5" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#17324d" font-weight="700" text-anchor="middle">Inference</text><text x="612.5" y="271" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">35 ms</text><rect x="770" y="220" width="177" height="85" rx="0" fill="#087f8c" stroke="none"/><text x="860.0" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#087f8c" font-weight="700" text-anchor="middle">Display</text><text x="860.0" y="271" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">20 ms</text><line x1="50" y1="345" x2="950" y2="345" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="378" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#17324d" font-weight="700" text-anchor="middle">Total latency includes every stage</text><rect x="165" y="415" width="670" height="75" rx="10" fill="white" stroke="#d4e1e6"/><rect x="165" y="415" width="5" height="75" rx="0" fill="#087f8c" stroke="none"/><text x="185" y="447" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">Freshness policy</text><text x="185" y="477" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Drop or suppress stale output; do not let queues grow indefinitely.</text><line x1="38" y1="510" x2="962" y2="510" stroke="#d4e1e6" stroke-width="1"/><text x="38" y="539" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526777" font-weight="400" text-anchor="start">Original schematic • AI in Medical Imaging • Not a patient image</text></svg>