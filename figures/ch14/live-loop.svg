<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>Keep ultrasound feedback current</title><desc>Separate the fast guidance loop from record completion.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f8c"/></marker></defs><rect width="1000" height="560" fill="#f7fafb"/><text x="38" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">Keep ultrasound feedback current</text><text x="38" y="80" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" font-weight="400" text-anchor="start">Separate the fast guidance loop from record completion.</text><line x1="38" y1="100" x2="962" y2="100" stroke="#087f8c" stroke-width="2"/><rect x="60" y="135" width="400" height="140" rx="10" fill="white" stroke="#d4e1e6"/><rect x="60" y="135" width="5" height="140" rx="0" fill="#087f8c" stroke="none"/><text x="80" y="167" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">1. Acquire</text><text x="80" y="197" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Timestamp live frames and maintain</text><text x="80" y="222" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">patient/session identity.</text><rect x="540" y="135" width="400" height="140" rx="10" fill="white" stroke="#d4e1e6"/><rect x="540" y="135" width="5" height="140" rx="0" fill="#087f8c" stroke="none"/><text x="560" y="167" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">2. Bounded inference</text><text x="560" y="197" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Process supported current inputs; prevent</text><text x="560" y="222" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">stale queues.</text><rect x="540" y="325" width="400" height="140" rx="10" fill="white" stroke="#d4e1e6"/><rect x="540" y="325" width="5" height="140" rx="0" fill="#087f8c" stroke="none"/><text x="560" y="357" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">3. Guide operator</text><text x="560" y="387" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Show timely, interpretable view and</text><text x="560" y="412" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">quality feedback.</text><rect x="60" y="325" width="400" height="140" rx="10" fill="white" stroke="#d4e1e6"/><rect x="60" y="325" width="5" height="140" rx="0" fill="#087f8c" stroke="none"/><text x="80" y="357" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">4. Accept and save</text><text x="80" y="387" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Store reviewed clips and measurements in</text><text x="80" y="412" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">the clinical record.</text><line x1="465" y1="205" x2="525" y2="205" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><line x1="740" y1="280" x2="740" y2="313" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><line x1="530" y1="395" x2="475" y2="395" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="490" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c65a46" font-weight="700" text-anchor="middle">A slow administrative task should not block live guidance</text><line x1="38" y1="510" x2="962" y2="510" stroke="#d4e1e6" stroke-width="1"/><text x="38" y="539" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526777" font-weight="400" text-anchor="start">Original schematic • AI in Medical Imaging • Not a patient image</text></svg>