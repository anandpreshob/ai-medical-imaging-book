<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>Ejection fraction: inputs before arithmetic</title><desc>Illustrative volumes; the figure does not validate contours or clinical interpretation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f8c"/></marker></defs><rect width="1000" height="560" fill="#f7fafb"/><text x="38" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">Ejection fraction: inputs before arithmetic</text><text x="38" y="80" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" font-weight="400" text-anchor="start">Illustrative volumes; the figure does not validate contours or clinical interpretation.</text><line x1="38" y1="100" x2="962" y2="100" stroke="#087f8c" stroke-width="2"/><rect x="160" y="175" width="150" height="240" rx="10" fill="#e4eaed" stroke="none"/><rect x="160" y="175" width="150" height="240" rx="10" fill="#087f8c" stroke="none"/><text x="235" y="150" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#087f8c" font-weight="700" text-anchor="middle">End diastole</text><text x="235" y="450" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f8c" font-weight="700" text-anchor="middle">120 mL</text><rect x="470" y="175" width="150" height="240" rx="10" fill="#e4eaed" stroke="none"/><rect x="470" y="315" width="150" height="100" rx="10" fill="#c65a46" stroke="none"/><text x="545" y="150" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#c65a46" font-weight="700" text-anchor="middle">End systole</text><text x="545" y="450" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c65a46" font-weight="700" text-anchor="middle">50 mL</text><rect x="700" y="215" width="255" height="150" rx="10" fill="white" stroke="#d4e1e6"/><rect x="700" y="215" width="5" height="150" rx="0" fill="#087f8c" stroke="none"/><text x="720" y="247" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">EF ≈ 58%</text><text x="720" y="277" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">(120 − 50) / 120 × 100</text><text x="500" y="487" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#17324d" font-weight="700" text-anchor="middle">Verify the view, cardiac phase, contours, and volume method first.</text><line x1="38" y1="510" x2="962" y2="510" stroke="#d4e1e6" stroke-width="1"/><text x="38" y="539" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526777" font-weight="400" text-anchor="start">Original schematic • AI in Medical Imaging • Not a patient image</text></svg>