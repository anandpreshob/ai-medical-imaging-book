<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>MRI contrasts answer different questions</title><desc>Sequence identity is part of the input, not an optional filename hint.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f8c"/></marker></defs><rect width="1000" height="560" fill="#f7fafb"/><text x="38" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">MRI contrasts answer different questions</text><text x="38" y="80" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" font-weight="400" text-anchor="start">Sequence identity is part of the input, not an optional filename hint.</text><line x1="38" y1="100" x2="962" y2="100" stroke="#087f8c" stroke-width="2"/><rect x="40.0" y="155" width="215.0" height="280" rx="10" fill="white" stroke="#d4e1e6"/><rect x="40.0" y="155" width="5" height="280" rx="0" fill="#087f8c" stroke="none"/><text x="60.0" y="187" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">T1</text><text x="60.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Anatomical contrast;</text><text x="60.0" y="242" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">pre- and post-</text><text x="60.0" y="267" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">contrast acquisitions</text><text x="60.0" y="292" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">have different roles.</text><rect x="275.0" y="155" width="215.0" height="280" rx="10" fill="white" stroke="#d4e1e6"/><rect x="275.0" y="155" width="5" height="280" rx="0" fill="#c65a46" stroke="none"/><text x="295.0" y="187" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#c65a46" font-weight="700" text-anchor="start">T2 / FLAIR</text><text x="295.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Fluid-sensitive</text><text x="295.0" y="242" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">contrasts; FLAIR</text><text x="295.0" y="267" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">suppresses much of</text><text x="295.0" y="292" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">the CSF signal.</text><rect x="510.0" y="155" width="215.0" height="280" rx="10" fill="white" stroke="#d4e1e6"/><rect x="510.0" y="155" width="5" height="280" rx="0" fill="#087f8c" stroke="none"/><text x="530.0" y="187" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" font-weight="700" text-anchor="start">DWI / ADC</text><text x="530.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Diffusion-weighted</text><text x="530.0" y="242" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">signal interpreted</text><text x="530.0" y="267" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">with a derived ADC</text><text x="530.0" y="292" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">map.</text><rect x="745.0" y="155" width="215.0" height="280" rx="10" fill="white" stroke="#d4e1e6"/><rect x="745.0" y="155" width="5" height="280" rx="0" fill="#c65a46" stroke="none"/><text x="765.0" y="187" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#c65a46" font-weight="700" text-anchor="start">Susceptibility</text><text x="765.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">Sensitivity to local</text><text x="765.0" y="242" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">magnetic-field</text><text x="765.0" y="267" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">variation; task-</text><text x="765.0" y="292" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">specific</text><text x="765.0" y="317" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526777" font-weight="400" text-anchor="start">interpretation.</text><text x="500" y="478" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#17324d" font-weight="700" text-anchor="middle">A missing required sequence is an explicit state</text><line x1="38" y1="510" x2="962" y2="510" stroke="#d4e1e6" stroke-width="1"/><text x="38" y="539" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526777" font-weight="400" text-anchor="start">Original schematic • AI in Medical Imaging • Not a patient image</text></svg>