project:
  type: book
  output-dir: _book
  resources:
    - llms.txt

book:
  title: "AI in Medical Imaging"
  subtitle: "From Pixels to Practice"
  author: "Anand Kadumberi"
  date: today
  repo-url: https://github.com/anandpreshob/ai-medical-imaging-book
  repo-actions: [edit, issue]
  site-url: https://anandpreshob.github.io/ai-medical-imaging-book/
  page-footer:
    left: "© 2026 Anand Kadumberi · Apache-2.0"
    right: "[anandpreshob.com](https://www.anandpreshob.com)"
  chapters:
    - index.qmd
    - part: "I — The Landscape of Medical Imaging"
      chapters:
        - chapters/01-introduction.qmd
        - chapters/02-universe-of-medical-images.qmd
        - chapters/03-images-in-the-hospital.qmd
        - chapters/04-medical-image-viewers.qmd
    - part: "II — Foundations: Machine Learning & Computer Vision"
      chapters:
        - chapters/05-machine-learning-concepts.qmd
        - chapters/06-what-computer-vision-can-do.qmd
        - chapters/07-deep-learning-architectures.qmd
        - chapters/08-generative-and-frontier-models.qmd
        - chapters/09-agentic-ai.qmd
        - chapters/10-from-model-to-product.qmd
    - part: "III — Diagnostic Imaging, Modality by Modality"
      chapters:
        - chapters/11-chest-xray.qmd
        - chapters/12-computed-tomography.qmd
        - chapters/13-mri.qmd
        - chapters/14-ultrasound-echo.qmd
        - chapters/15-mammography.qmd
        - chapters/16-nuclear-medicine.qmd
        - chapters/17-ophthalmic-imaging.qmd
    - part: "IV — Interventional, Lab-Based & Video"
      chapters:
        - chapters/18-surgical-endoscopic-video.qmd
        - chapters/19-digital-pathology.qmd
        - chapters/20-the-remaining-map.qmd
    - part: "V — Systems & The Road Ahead"
      chapters:
        - chapters/21-building-an-imaging-ai-platform.qmd
        - chapters/22-ethics-bias-future.qmd
  appendices:
    - appendices/a-dataset-directory.qmd
    - appendices/b-model-zoo.qmd
    - appendices/c-fda-product-index.qmd
    - appendices/d-dicom-quick-reference.qmd
    - appendices/f-dual-glossary.qmd

bibliography: references.bib

format:
  html:
    theme:
      light: [cosmo, theme/custom.scss]
      dark: [darkly, theme/custom.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    link-external-newwindow: true

execute:
  freeze: auto
